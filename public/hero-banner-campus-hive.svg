<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 684" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter for Pill & Button -->
    <filter id="card-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="btn-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="yellow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE182"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFC928"/>
    </linearGradient>
    <linearGradient id="dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22252A"/>
      <stop offset="100%" stop-color="#14161D"/>
    </linearGradient>

    <!-- Honeycomb Hexagon Definition -->
    <polygon id="hex" points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" />
    <polygon id="hex-lg" points="0,-48 41.5,-24 41.5,24 0,48 -41.5,24 -41.5,-24" />
    <polygon id="hex-sm" points="0,-32 27.7,-16 27.7,16 0,32 -27.7,16 -27.7,-16" />
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap');
    text {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
  </style>

  <!-- Background Base -->
  <rect width="2048" height="684" fill="#FAFAFB" />

  <!-- ========================================== -->
  <!-- CORNER ARTWORK & FLUID ORGANIC BLOBS      -->
  <!-- ========================================== -->

  <!-- Top-Left Yellow Fluid Shape -->
  <path d="M 0,0 L 580,0 C 510,120 440,190 320,200 C 180,210 110,240 0,330 Z" fill="url(#yellow-grad)" />
  <path d="M 0,0 L 595,0 C 520,125 450,195 330,205 C 190,215 120,245 0,345" fill="none" stroke="#171717" stroke-width="2" stroke-opacity="0.35" />

  <!-- Bottom-Left Charcoal Fluid Shape -->
  <path d="M 0,684 L 0,450 C 90,460 160,520 250,560 C 370,610 430,620 520,684 Z" fill="url(#dark-grad)" />
  <path d="M 0,435 C 95,445 170,505 260,545 C 380,595 440,605 540,684" fill="none" stroke="#FFC928" stroke-width="3.5" />

  <!-- Top-Right Charcoal Fluid Shape -->
  <path d="M 2048,0 L 1680,0 C 1760,110 1820,170 1920,200 C 1980,220 2020,230 2048,270 Z" fill="url(#dark-grad)" />
  <path d="M 1660,0 C 1740,115 1805,175 1905,205 C 1970,225 2010,235 2048,285" fill="none" stroke="#FFC928" stroke-width="3" />

  <!-- Bottom-Right Yellow Fluid Shape -->
  <path d="M 2048,684 L 1380,684 C 1510,630 1620,530 1780,520 C 1910,510 1990,460 2048,360 Z" fill="url(#yellow-grad)" />
  <path d="M 1360,684 C 1495,620 1605,520 1765,510 C 1895,500 1975,450 2048,345" fill="none" stroke="#171717" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Floating Honeycomb Hexagons (Left) -->
  <use href="#hex-lg" x="85" y="405" fill="#FFE182" fill-opacity="0.65" />
  <use href="#hex-sm" x="210" y="475" fill="#FFC928" fill-opacity="0.4" />

  <!-- Floating Honeycomb Hexagons (Right) -->
  <use href="#hex-lg" x="1800" y="270" fill="#FFE182" fill-opacity="0.55" />
  <use href="#hex-sm" x="1940" y="340" fill="#FFC928" fill-opacity="0.45" />

  <!-- ========================================== -->
  <!-- CENTER HERO CONTENT                        -->
  <!-- ========================================== -->

  <!-- 1. Top Pill Badge: "Welcome to the" + Honeycomb Icon -->
  <g transform="translate(1024, 160)">
    <!-- Pill Container -->
    <rect x="-195" y="-30" width="390" height="60" rx="30" ry="30" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="1.5" filter="url(#card-shadow)" />

    <!-- Honeycomb Emblem inside Badge -->
    <g transform="translate(-142, 0)">
      <!-- Top Hexagon -->
      <polygon points="0,-10 8.6,-5 8.6,5 0,10 -8.6,5 -8.6,-5" fill="none" stroke="#FFC928" stroke-width="2.2" />
      <!-- Bottom-Left Hexagon -->
      <polygon points="-8,5 -0.6,1 -0.6,9 -8,13 -15.4,9 -15.4,1" fill="none" stroke="#FFC928" stroke-width="2.2" />
      <!-- Bottom-Right Hexagon -->
      <polygon points="8,5 15.4,1 15.4,9 8,13 0.6,9 0.6,1" fill="none" stroke="#FFC928" stroke-width="2.2" />
    </g>

    <!-- Pill Text -->
    <text x="12" y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#171717" letter-spacing="-0.3">
      Welcome to the
    </text>
  </g>

  <!-- 2. Main Title: "Campus" in Black + Yellow Honeycomb Logo & "Hive" -->
  <g transform="translate(1024, 285)">
    <!-- "Campus" -->
    <text x="-165" y="0" text-anchor="end" font-size="94" font-weight="900" fill="#171717" letter-spacing="-3">
      Campus
    </text>

    <!-- Yellow Honeycomb Brand Emblem (Interlocking Hexagons) -->
    <g transform="translate(-105, -34)">
      <!-- Central Top Hexagon -->
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" fill="#FFC928" />
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" fill="none" stroke="#D9A300" stroke-width="2" />
      <!-- Inner core accent -->
      <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="#FFFFFF" fill-opacity="0.35" />

      <!-- Left Hexagon -->
      <polygon points="-24,13 -1.5,0 -1.5,26 -24,39 -46.5,26 -46.5,0" fill="#FFD54F" />
      <polygon points="-24,13 -1.5,0 -1.5,26 -24,39 -46.5,26 -46.5,0" fill="none" stroke="#D9A300" stroke-width="2" />

      <!-- Right Hexagon -->
      <polygon points="24,13 46.5,0 46.5,26 24,39 1.5,26 1.5,0" fill="#FFB703" />
      <polygon points="24,13 46.5,0 46.5,26 24,39 1.5,26 1.5,0" fill="none" stroke="#D9A300" stroke-width="2" />
    </g>

    <!-- "Hive" in signature Brand Gold -->
    <text x="-40" y="0" text-anchor="start" font-size="94" font-weight="900" fill="#FFC928" letter-spacing="-3">
      Hive
    </text>
  </g>

  <!-- 3. Description Subtitle -->
  <g transform="translate(1024, 375)">
    <text x="0" y="0" text-anchor="middle" font-size="25" font-weight="500" fill="#4B5563" letter-spacing="-0.4">
      The verified campus marketplace to discover student deals, buy &amp; sell gear,
    </text>
    <text x="0" y="38" text-anchor="middle" font-size="25" font-weight="500" fill="#4B5563" letter-spacing="-0.4">
      and connect safely across your university community.
    </text>
  </g>

  <!-- 4. Interactive Call to Action (CTA) Button -->
  <g transform="translate(1024, 495)">
    <!-- Primary CTA Button -->
    <g transform="translate(-145, 0)">
      <rect x="-140" y="-30" width="280" height="60" rx="18" ry="18" fill="#171717" filter="url(#btn-shadow)" />
      <text x="-12" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="-0.2">
        Explore Marketplace
      </text>
      <!-- Arrow Icon -->
      <path d="M 88,1 L 96,1 M 91,-4 L 96,1 L 91,6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Secondary CTA Button: "Post a Listing" -->
    <g transform="translate(155, 0)">
      <rect x="-115" y="-30" width="230" height="60" rx="18" ry="18" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2" />
      <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="700" fill="#171717" letter-spacing="-0.2">
        Post a Listing
      </text>
    </g>
  </g>
</svg>
